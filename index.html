<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧備料 - 專業配置版</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --dopa-pink: #FF6B9D;
            --dopa-yellow: #FFD93D;
            --dopa-cyan: #4ECDC4;
            --dopa-purple: #A29BFE;
            --dopa-orange: #FF8066;
            --bg-gradient: radial-gradient(circle at top left, #FFDEE9 0%, #B5FFFC 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 10px;
            color: #333;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--glass-bg);
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 4px solid #ffffff;
            backdrop-filter: blur(15px);
            margin: 20px auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            background: linear-gradient(45deg, var(--dopa-pink), var(--dopa-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-weight: 900;
        }

        .upload-wrapper { text-align: center; margin-bottom: 30px; }
        #fileInput { display: none; }
        .custom-upload-btn {
            display: inline-block;
            padding: 15px 50px;
            background: var(--dopa-pink);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
            border: 2px solid #fff;
        }

        .top-selector {
            background: rgba(255,255,255,0.5);
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 25px; text-align: center;
        }

        .filter-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dopa-purple);
            font-size: 0.9em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .glass-card {
            background: white;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            border: 2px solid #f8f8f8;
        }

        .prediction-box {
            background: linear-gradient(135deg, #fff9e6 0%, #ffffff 100%);
            border: 3px solid var(--dopa-yellow);
        }

        .prediction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .pred-detail {
            background: #fdfdfd;
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #eee;
        }

        .pred-val { font-weight: bold; color: var(--dopa-purple); font-size: 1.2em; }

        .suggestion-num {
            font-size: 3.5em;
            font-weight: 900;
            color: var(--dopa-pink);
            text-shadow: 2px 2px 0px #fff;
            margin: 10px 0;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #eee;
            background: white;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }

        select:focus { border-color: var(--dopa-pink); outline: none; }

        .item-select-wrap {
            margin: 15px 0;
            padding: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            border: 1px solid var(--dopa-yellow);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 25px;
            background: white;
            padding: 10px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px; text-align: left; color: #999; font-size: 0.85em; border-bottom: 2px solid #f9f9f9; }
        td { padding: 15px 10px; border-bottom: 1px solid #f1f1f1; font-size: 0.95em; }

        .heat-bar-wrap { width: 60px; height: 8px; background: #eee; border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 5px; }
        .heat-bar { height: 100%; border-radius: 4px; background: var(--dopa-cyan); }

        .badge { padding: 4px 10px; border-radius: 8px; font-size: 0.8em; font-weight: bold; color: white; }
        .bg-red { background: var(--dopa-orange); }
        .bg-green { background: var(--dopa-cyan); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #mainContent { animation: fadeInUp 0.5s ease; }
    </style>
</head>
<body>

<div class="container">
    <h1>智慧備料</h1>

    <div class="upload-wrapper">
        <label for="fileInput" class="custom-upload-btn" id="uploadLabel">
            🌈 上傳檔案，分析數據
        </label>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
    </div>

    <div id="mainContent" style="display:none;">
        <!-- 頂部僅保留門市選擇 -->
        <div class="top-selector">
            <div class="filter-item" style="max-width: 400px; margin: 0 auto;">
                <label>📍 選擇門市</label>
                <select id="storeSelect">
                    <option value="ALL">-- 全部門市 --</option>
                </select>
            </div>
        </div>

        <div class="dashboard">
            <div class="glass-card prediction-box">
                <h3 style="margin:0;"><span style="font-size: 1.2em;">🔮</span> 明日門市預測</h3>
                
                <!-- 品項選單移至此處 -->
                <div class="item-select-wrap">
                    <label style="font-size: 0.85em; color: #888; margin-bottom: 5px; display: block;">🍴 請選擇預測品項</label>
                    <select id="itemSelect">
                        <option value="">-- 請先選門市 --</option>
                    </select>
                </div>

                <div id="predictionResult" style="text-align:center;">
                    <div class="suggestion-num" id="mainSuggest">-</div>
                    <div style="color:#888; margin-bottom:15px; font-weight: bold;">建議備料區間：<span id="suggestRange" style="color: var(--dopa-pink);">-</span></div>
                    
                    <div class="prediction-grid">
                        <div class="pred-detail"><span>週幾平均</span><br><span class="pred-val" id="dayAvg">-</span></div>
                        <div class="pred-detail"><span>歷史最高</span><br><span class="pred-val" id="histMax">-</span></div>
                        <div class="pred-detail"><span>歷史最低</span><br><span class="pred-val" id="histMin">-</span></div>
                        <div class="pred-detail"><span>波動係數</span><br><span class="pred-val" id="volatility">-</span></div>
                    </div>
                </div>
            </div>
            
            <div class="glass-card">
                <h3 style="margin:0 0 10px 0;">📊 本地數據概況</h3>
                <div style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span>活躍品項</span>
                        <strong style="color:var(--dopa-purple); font-size:1.5em;" id="totalItems">0</strong>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span>平均銷售強度</span>
                        <strong style="color:var(--dopa-cyan); font-size:1.5em;" id="avgHeat">0</strong>
                    </div>
                    <hr style="border:0; border-top:1px solid #eee; width:100%;">
                    <div style="font-size:0.85em; color:#888; line-height: 1.5;">
                        * 已根據選定門市動態調整<br>
                        * 系統自動識別 [A, B, C] 類數據
                    </div>
                </div>
            </div>
        </div>

        <h3 style="margin:0 0 15px 20px;">📅 門市銷售深度報表</h3>
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>門市</th>
                        <th>品項</th>
                        <th>銷售強度</th>
                        <th>實際備料</th>
                        <th>狀態</th>
                        <th>建議區間</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let stores = [];
    let itemsByStore = {};
    let dataByStoreAndItem = {};
    let maxSalesGlobal = 1;

    const VAL_MAP = {
        'A': 100, 'B': 50, 'C': 20,
        '項目1': 30, '項目2': 60, '項目3': 90,
        '高': 120, '中': 70, '低': 30
    };

    function parseSmartValue(val) {
        if (typeof val === 'number') return val;
        if (!val) return 0;
        const strVal = String(val).trim();
        if (VAL_MAP[strVal]) return VAL_MAP[strVal];
        const num = parseFloat(strVal.replace(/[^0-9.]/g, ''));
        return isNaN(num) ? 0 : num;
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: 0 });
            processData(json);
        };
        reader.readAsArrayBuffer(file);
    });

    function processData(data) {
        const keys = Object.keys(data[0]);
        const dateKey = keys.find(k => k.match(/日期|Date/i)) || keys[0];
        const storeKey = keys.find(k => k.match(/門市|店名|店舖|Store|Branch/i)) || keys.find(k=>k==='門市') || '門市';
        const itemKey = keys.find(k => k.match(/菜色|品項|項目|Item|Name/i)) || keys[1];
        const salesKey = keys.find(k => k.match(/銷售量|銷售數量|數量|Sales|Qty/i)) || keys[2];
        const prepKey = keys.find(k => k.match(/備料量|備料|Prep/i)) || keys[3];

        data.sort((a, b) => {
            let dA = (a[dateKey] instanceof Date) ? a[dateKey] : new Date(a[dateKey]);
            let dB = (b[dateKey] instanceof Date) ? b[dateKey] : new Date(b[dateKey]);
            return dA - dB;
        });

        rawData = data;
        const storeSet = new Set();
        itemsByStore = { 'ALL': new Set() };
        dataByStoreAndItem = { 'ALL': {} };
        maxSalesGlobal = 1;

        data.forEach(row => {
            const storeName = row[storeKey] || '未分類門市';
            const itemName = row[itemKey];
            if (!itemName) return;

            const sales = parseSmartValue(row[salesKey]);
            const prep = parseSmartValue(row[prepKey]);
            row._salesNum = sales;
            row._prepNum = prep;
            row._storeName = storeName;
            row._itemName = itemName;
            row._dateObj = (row[dateKey] instanceof Date) ? row[dateKey] : new Date(row[dateKey]);

            if (sales > maxSalesGlobal) maxSalesGlobal = sales;
            
            storeSet.add(storeName);
            if (!itemsByStore[storeName]) itemsByStore[storeName] = new Set();
            itemsByStore[storeName].add(itemName);
            itemsByStore['ALL'].add(itemName);

            const dow = row._dateObj.getDay();
            [storeName, 'ALL'].forEach(sKey => {
                if (!dataByStoreAndItem[sKey]) dataByStoreAndItem[sKey] = {};
                if (!dataByStoreAndItem[sKey][itemName]) dataByStoreAndItem[sKey][itemName] = { history: [], dowStats: {} };
                dataByStoreAndItem[sKey][itemName].history.push(sales);
                if (!dataByStoreAndItem[sKey][itemName].dowStats[dow]) dataByStoreAndItem[sKey][itemName].dowStats[dow] = [];
                dataByStoreAndItem[sKey][itemName].dowStats[dow].push(sales);
            });
        });

        stores = Array.from(storeSet).sort();
        initDropdowns();
        updateUI();
    }

    function initDropdowns() {
        const storeSelect = document.getElementById('storeSelect');
        storeSelect.innerHTML = '<option value="ALL">-- 全部門市 --</option>';
        stores.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s; opt.innerText = s;
            storeSelect.appendChild(opt);
        });

        storeSelect.onchange = () => {
            updateItemDropdown();
            updateUI();
        };
        updateItemDropdown();
    }

    function updateItemDropdown() {
        const store = document.getElementById('storeSelect').value;
        const itemSelect = document.getElementById('itemSelect');
        const items = Array.from(itemsByStore[store] || []).sort();
        
        itemSelect.innerHTML = '<option value="">-- 請選擇品項 --</option>';
        items.forEach(i => {
            const opt = document.createElement('option');
            opt.value = i; opt.innerText = i;
            itemSelect.appendChild(opt);
        });
        itemSelect.onchange = updatePrediction;
    }

    function updateUI() {
        document.getElementById('mainContent').style.display = 'block';
        const store = document.getElementById('storeSelect').value;
        const filtered = store === 'ALL' ? rawData : rawData.filter(r => r._storeName === store);

        document.getElementById('totalItems').innerText = itemsByStore[store].size;
        const avgHeat = filtered.length ? Math.round(filtered.reduce((a,b)=>a+b._salesNum,0)/filtered.length) : 0;
        document.getElementById('avgHeat').innerText = avgHeat;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        filtered.forEach(row => {
            const tr = document.createElement('tr');
            const lowRange = Math.round(row._salesNum * 0.9);
            const highRange = Math.round(row._salesNum * 1.2);

            tr.innerHTML = `
                <td style="color:var(--dopa-purple);">${formatDate(row._dateObj)}</td>
                <td>${row._storeName}</td>
                <td style="font-weight:bold;">${row._itemName}</td>
                <td>
                    <div class="heat-bar-wrap"><div class="heat-bar" style="width:${(row._salesNum/maxSalesGlobal*100)}%"></div></div>
                    ${row._salesNum}
                </td>
                <td>${row._prepNum || '-'}</td>
                <td>${row._prepNum < row._salesNum ? '<span class="badge bg-red">缺料</span>' : '<span class="badge bg-green">足夠</span>'}</td>
                <td style="font-size:0.85em; color:#888;">${lowRange} ~ ${highRange}</td>
            `;
            tbody.appendChild(tr);
        });
        updatePrediction();
    }

    function updatePrediction() {
        const store = document.getElementById('storeSelect').value;
        const item = document.getElementById('itemSelect').value;
        
        if (!item) {
            document.getElementById('mainSuggest').innerText = "-";
            document.getElementById('suggestRange').innerText = "-";
            ['dayAvg','histMax','histMin','volatility'].forEach(id => document.getElementById(id).innerText = "-");
            return;
        }

        const stats = dataByStoreAndItem[store][item];
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const dow = tomorrow.getDay();
        const dowValues = stats.dowStats[dow] || stats.history;

        const avg = dowValues.reduce((a,b)=>a+b,0) / dowValues.length;
        const overallAvg = stats.history.reduce((a,b)=>a+b,0) / stats.history.length;
        const max = Math.max(...dowValues);
        const min = Math.min(...dowValues);
        
        const weightedAvg = (avg * 0.7) + (overallAvg * 0.3);
        const finalSuggest = Math.ceil(weightedAvg * 1.1);

        document.getElementById('mainSuggest').innerText = finalSuggest;
        document.getElementById('suggestRange').innerText = `${Math.ceil(weightedAvg * 0.9)} ~ ${Math.ceil(weightedAvg * 1.2)}`;
        document.getElementById('dayAvg').innerText = avg.toFixed(1);
        document.getElementById('histMax').innerText = max;
        document.getElementById('histMin').innerText = min;
        document.getElementById('volatility').innerText = (((max-min)/(avg||1))*100).toFixed(0) + "%";
    }

    function formatDate(date) {
        if (isNaN(date.getTime())) return "日期錯誤";
        const m = date.getMonth()+1, d = date.getDate();
        const weekDays = ['日','一','二','三','四','五','六'];
        return `${m}/${d} (${weekDays[date.getDay()]})`;
    }
</script>

</body>
</html>
